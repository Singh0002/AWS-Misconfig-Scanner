[theme]
base = "light"
# AWS Orange for buttons and highlights, AWS Dark Slate for text
primaryColor = "#FF9900"
textColor = "#252F3E"
backgroundColor = "#F6F4F0"
secondaryBackgroundColor = "#FFFFFF"
borderColor = "#E4DED3"
linkColor = "#B26A00"
baseRadius = "large"
font = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
# severity colors: red High, orange Medium, blue Low, green Passed, yellow Couldn't check
redColor = "#C8372D"
orangeColor = "#B26A00"
blueColor = "#2F6FB0"
greenColor = "#2F8A4C"
yellowColor = "#A68A00"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
